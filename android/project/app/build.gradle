apply plugin: 'com.android.application'

android {
    namespace "org.libsdl.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "io.github.recompcode.dbzbt4"
        minSdkVersion 31
        targetSdkVersion 35
        versionCode 30406
        versionName "3.4.6"
        ndk { abiFilters 'arm64-v8a' }
    }
    // Release signing: the key stays outside the repository (ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS).
    // Every update has to be signed with the same key, or Android refuses to install it over the previous version.
    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASS")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "recomp"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASS")
            }
        }
    }
    buildTypes {
        // debug: the game activity can be started with adb (training runs, tests); release: only the launcher starts it
        debug { debuggable true; jniDebuggable true; manifestPlaceholders = [gameExported: "true"] }
        release { minifyEnabled false; manifestPlaceholders = [gameExported: "false"]; signingConfig signingConfigs.release }
    }
    sourceSets.main { jniLibs.srcDir 'libs' }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    aaptOptions { noCompress 'bin' }
    lint { abortOnError false }
}
