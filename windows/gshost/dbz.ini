; DBZ Budokai Tenkaichi 4 (mod de BT3, SLUS-21978): opciones del GS de PCSX2 (menu F1). Se reescribe al cambiar.
; Windows / Vulkan. 6x = 3840x2688 interno (supermuestreo en 1440p). NbaUpscaler: 0 = no, 1 = AMD FSR 1, 2 = NVIDIA DLSS
; (FSR si DLSS no esta disponible); solo actua cuando la resolucion interna es menor que la ventana (p. ej. 2x/3x en 1440p o 4K).
[EmuCore/GS]
Renderer = 14
upscale_multiplier = 6
MaxAnisotropy = 16
filter = 2
fxaa = false
CASMode = 0
NbaUpscaler = 2
NbaUpscalerSharpness = 35
ScreenshotSize = 0
AspectRatio = 16:9
OsdShowFPS = false
VsyncEnable = 1
pcrtc_antiblur = false
pcrtc_offsets = false
UserHacks = true
UserHacks_merge_pp_sprite = true
UserHacks_CPUCLUTRender = 1
; Texture offset that removes the doubled cel-shading outline, per internal resolution (measured against the 1x render)
UserHacks_TCOffsetByScale = 1:0/0,2:345/345,3:425/425,4:425/425,5:425/425,6:500/500,8:500/500
UserHacks_TCOffsetX = 500
UserHacks_TCOffsetY = 500
LoadTextureReplacements = false
DumpReplaceableTextures = false
